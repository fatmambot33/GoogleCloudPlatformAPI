name: Upgrade Ad Manager API

on:
  push:
    branches:
      - agent/upgrade-ad-manager-v202602
    paths:
      - .github/workflows/upgrade-ad-manager-v202602.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/upgrade-ad-manager-v202602
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply upgrade
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("GoogleCloudPlatformAPI/AdManager.py"): ("v202505", "v202602"),
              Path("README.md"): ("v202505", "v202602"),
              Path("pyproject.toml"): ('version = "2.4.0"', 'version = "2.5.0"'),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"Expected {old!r} in {path}")
              path.write_text(text.replace(old, new))
          PY

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          pytest -q

      - name: Remove temporary workflow
        run: rm .github/workflows/upgrade-ad-manager-v202602.yml

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GoogleCloudPlatformAPI/AdManager.py README.md pyproject.toml .github/workflows/upgrade-ad-manager-v202602.yml
          git commit -m "Upgrade Ad Manager API to v202602 and bump version to 2.5.0"
          git push origin HEAD:agent/upgrade-ad-manager-v202602
