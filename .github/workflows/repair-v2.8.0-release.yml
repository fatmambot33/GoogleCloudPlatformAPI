name: Repair v2.8.0 release assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-v2.8.0-release.yml

permissions:
  actions: read
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: "31098731725"
      TAG: v2.8.0
      EXPECTED_COMMIT: 9ec63913be2d2c763391f0beace7da6da33cb989
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: release-dist
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Upload the original verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-list -n 1 "$TAG")" = "$EXPECTED_COMMIT"
          mapfile -d '' assets < <(
            find release-dist release-evidence -type f -print0
          )
          test "${#assets[@]}" -ge 7
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "${assets[@]}" --clobber
      - name: Verify the complete release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | sort > release-assets.txt
          for expected in \
            googlecloudplatformapi-2.8.0-py3-none-any.whl \
            googlecloudplatformapi-2.8.0.tar.gz \
            scorecard.json \
            scorecard.md \
            evaluations.xml \
            sbom.cdx.json \
            mcp-smoke.jsonl
          do
            grep -Fxq "$expected" release-assets.txt
          done
