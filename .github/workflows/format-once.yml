name: Format branch once

on:
  push:
    branches:
      - agent/safe-observable-execution

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/safe-observable-execution
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned formatter
        run: python -m pip install 'black==24.8.0'
      - name: Apply exact formatting
        run: black .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Apply exact Black 24.8.0 formatting'
          git push origin HEAD:agent/safe-observable-execution
