name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-branch:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/safe-observable-execution' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned formatter
        run: python -m pip install 'black==24.8.0'
      - name: Apply exact formatting
        run: black .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply exact Black 24.8.0 formatting"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Check documentation style
        run: pydocstyle GoogleCloudPlatformAPI

      - name: Check formatting
        run: black --check --diff .

      - name: Run static type analysis
        run: pyright GoogleCloudPlatformAPI

      - name: Run tests with coverage
        run: pytest -q --cov=GoogleCloudPlatformAPI --cov-report=term-missing --cov-fail-under=90

  dependency-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimum supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/minimum-py310.txt ".[dev]"
      - name: Validate minimum dependency set
        run: |
          pyright GoogleCloudPlatformAPI
          pytest -q --cov=GoogleCloudPlatformAPI --cov-report=term-missing --cov-fail-under=90

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
      - name: Smoke test installed package and MCP entry point
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | .venv-wheel/bin/gcp-api-mcp > mcp-smoke.jsonl
          .venv-wheel/bin/python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path

          from GoogleCloudPlatformAPI.assets import read_text_resource

          responses = [json.loads(line) for line in Path("mcp-smoke.jsonl").read_text().splitlines()]
          assert responses[0]["result"]["serverInfo"]["version"] == "2.7.0"
          assert len(responses[1]["result"]["tools"]) == 8
          assert version("GoogleCloudPlatformAPI") == "2.7.0"
          assert "GoogleCloudPlatformAPI" in read_text_resource("llms.txt")
          assert "maximum_bytes_billed" in read_text_resource("codex/SKILL.md")
          PY
