name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Check documentation style
        run: pydocstyle GoogleCloudPlatformAPI

      - name: Check formatting
        run: black --check --diff .

      - name: Run static type analysis
        run: pyright GoogleCloudPlatformAPI

      - name: Run tests with coverage
        run: pytest -q --cov=GoogleCloudPlatformAPI --cov-report=term-missing --cov-fail-under=90

  dependency-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install minimum supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/minimum-py310.txt ".[dev]"
      - name: Validate minimum dependency set
        run: |
          pyright GoogleCloudPlatformAPI
          pytest -q --cov=GoogleCloudPlatformAPI --cov-report=term-missing --cov-fail-under=90

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install contract validation dependencies
        run: python -m pip install --disable-pip-version-check 'jsonschema>=4.23,<5' 'PyYAML>=6,<7'
      - name: Validate the pinned AI-native contract and repository evidence
        run: python scripts/validate_ai_native_platform.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distributions
        run: python -m twine check dist/*
      - name: Install wheel in a clean environment
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --upgrade pip
          .venv-wheel/bin/python -m pip install dist/*.whl
      - name: Smoke test installed package and MCP entry point
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | .venv-wheel/bin/gcp-api-mcp > mcp-smoke.jsonl
          .venv-wheel/bin/gcp-api-eval --output wheel-evidence --fail-under 100
          .venv-wheel/bin/python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path

          from GoogleCloudPlatformAPI.assets import read_text_resource

          responses = [json.loads(line) for line in Path("mcp-smoke.jsonl").read_text().splitlines()]
          scorecard = json.loads(Path("wheel-evidence/scorecard.json").read_text())
          installed_version = version("GoogleCloudPlatformAPI")
          assert responses[0]["result"]["serverInfo"]["version"] == installed_version
          assert len(responses[1]["result"]["tools"]) == 8
          assert installed_version
          assert scorecard["ready"] is True
          assert scorecard["score"] == 100.0
          assert "gcp-api-eval" in read_text_resource("llms.txt")
          assert "standard:" in read_text_resource("AI_NATIVE_PLATFORM.yaml")
          assert "AI Native Platform Product Manifest" in read_text_resource(
              "schemas/ai-native-platform.schema.json"
          )
          assert "def validate()" in read_text_resource(
              "scripts/validate_ai_native_platform.py"
          )
          assert "maximum_bytes_billed" in read_text_resource("codex/SKILL.md")
          assert "Golden scenarios" in read_text_resource("docs/ai-readiness.md")
          PY

  evidence:
    needs: [quality, dependency-floor, contract, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Generate AI readiness release evidence
        run: |
          mkdir -p build/ai-readiness
          gcp-api-eval --output build/ai-readiness --fail-under 100
          pytest -q tests/test_behavioral_evaluations.py tests/test_mcp_conformance.py \
            tests/test_release_evidence.py tests/test_openai_agents_adapter.py \
            --junitxml=build/ai-readiness/pytest.xml
      - uses: actions/upload-artifact@v4
        with:
          name: ai-readiness-evidence
          path: build/ai-readiness/

  ci:
    name: ci
    if: ${{ always() }}
    needs: [evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI
        shell: bash
        run: |
          echo "evidence=${{ needs.evidence.result }}"
          test "${{ needs.evidence.result }}" = "success"
