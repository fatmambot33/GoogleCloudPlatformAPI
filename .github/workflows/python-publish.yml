# Publishes each package version once, then creates matching release evidence.
name: Release Python package

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - .github/workflows/python-publish.yml
  workflow_dispatch:

concurrency:
  group: release-python-package
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.pypi.outputs.published }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve package version
        id: version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
      - name: Check whether the version is already on PyPI
        id: pypi
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import urllib.error
          import urllib.request

          url = "https://pypi.org/pypi/GoogleCloudPlatformAPI/json"
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  payload = {"releases": {}}
              else:
                  raise

          published = os.environ["VERSION"] in payload.get("releases", {})
          print(f"published={str(published).lower()}")
          PY
      - name: Report existing publication
        if: steps.pypi.outputs.published == 'true'
        run: echo "GoogleCloudPlatformAPI ${{ steps.version.outputs.version }} is already published; skipping release."

  build:
    needs: check
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install --upgrade build twine cyclonedx-bom
      - name: Build and validate distributions
        run: |
          python -m build --outdir release-dist
          python -m twine check release-dist/*
      - name: Install and smoke test release wheel
        run: |
          python -m venv .venv-release
          .venv-release/bin/python -m pip install --upgrade pip
          .venv-release/bin/python -m pip install release-dist/*.whl
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | .venv-release/bin/gcp-api-mcp > mcp-smoke.jsonl
          .venv-release/bin/python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path

          responses = [json.loads(line) for line in Path("mcp-smoke.jsonl").read_text().splitlines()]
          assert responses[0]["result"]["serverInfo"]["version"] == version("GoogleCloudPlatformAPI")
          assert len(responses[1]["result"]["tools"]) == 8
          PY
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p release-assets
          cyclonedx-py environment .venv-release/bin/python \
            --pyproject pyproject.toml \
            --output-format JSON \
            --output-reproducible \
            --output-file release-assets/sbom.cdx.json
      - name: Attest package distributions
        uses: actions/attest@v4
        with:
          subject-path: "release-dist/*"
      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: release-dist/
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            release-assets/sbom.cdx.json
            mcp-smoke.jsonl

  publish:
    needs:
      - check
      - build
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    needs:
      - check
      - build
      - publish
    if: needs.check.outputs.published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: release-dist
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence
      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            tag_commit="$(git rev-list -n 1 "$TAG")"
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Existing tag $TAG points to $tag_commit, not $GITHUB_SHA." >&2
              exit 1
            fi
          else
            git tag -a "$TAG" "$GITHUB_SHA" -m "GoogleCloudPlatformAPI $VERSION"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-dist/* release-evidence/* --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --generate-notes \
              release-dist/* \
              release-evidence/*
          fi
