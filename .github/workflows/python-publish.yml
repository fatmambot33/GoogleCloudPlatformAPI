name: Release Python package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install --upgrade build twine cyclonedx-bom
      - name: Build and validate distributions
        run: |
          python -m build --outdir release-dist
          python -m twine check release-dist/*
      - name: Install and smoke test release wheel
        run: |
          python -m venv .venv-release
          .venv-release/bin/python -m pip install --upgrade pip
          .venv-release/bin/python -m pip install release-dist/*.whl
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | .venv-release/bin/gcp-api-mcp > mcp-smoke.jsonl
          .venv-release/bin/python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path

          responses = [json.loads(line) for line in Path("mcp-smoke.jsonl").read_text().splitlines()]
          assert responses[0]["result"]["serverInfo"]["version"] == version("GoogleCloudPlatformAPI")
          assert len(responses[1]["result"]["tools"]) == 8
          PY
      - name: Generate CycloneDX SBOM
        run: |
          mkdir -p release-assets
          cyclonedx-py environment .venv-release/bin/python \
            --pyproject pyproject.toml \
            --output-format JSON \
            --output-reproducible \
            --output-file release-assets/sbom.cdx.json
      - name: Attest package distributions
        uses: actions/attest@v4
        with:
          subject-path: "release-dist/*"
      - name: Upload package distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: release-dist/
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            release-assets/sbom.cdx.json
            mcp-smoke.jsonl

  attach-evidence:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: release-evidence
      - name: Attach SBOM and smoke evidence to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            release-evidence/sbom.cdx.json \
            release-evidence/mcp-smoke.jsonl \
            --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
