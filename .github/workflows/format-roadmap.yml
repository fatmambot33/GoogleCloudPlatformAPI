name: Format roadmap branch

on:
  push:
    branches:
      - agent/behavioral-release-evidence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/behavioral-release-evidence
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned formatter
        run: python -m pip install 'black==24.8.0'
      - name: Apply formatter
        run: black .
      - name: Commit exact formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply exact Black 24.8.0 formatting"
          git push origin HEAD:agent/behavioral-release-evidence
