[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "GoogleCloudPlatformAPI"
version = "2.6.0"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas",
    "google-api-python-client",
    "google-cloud-bigquery",
    "google-cloud-bigquery[pandas]",
    "google-cloud-storage",
    "googleads",
    "db-dtypes",
    "python-dotenv",
]

[project.scripts]
gcp-api-mcp = "GoogleCloudPlatformAPI.codex.server:main"
gcp-api-agent = "GoogleCloudPlatformAPI.agents.cli:main"

[project.optional-dependencies]
dev = [
    "black==24.8.0",
    "build",
    "pydocstyle",
    "pyright",
    "pytest",
    "pytest-cov",
    "twine",
]
codex = []

[tool.black]
target-version = ["py38"]

[tool.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["GoogleCloudPlatformAPI"]

[tool.hatch.build.targets.wheel]
packages = ["GoogleCloudPlatformAPI"]

[tool.hatch.build.targets.sdist]
include = [
    "/GoogleCloudPlatformAPI",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/tests",
]
