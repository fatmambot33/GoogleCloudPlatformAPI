[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "GoogleCloudPlatformAPI"
version = "2.7.0"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.2.3,<3.0; python_version < '3.11'",
    "pandas>=3.0,<4.0; python_version >= '3.11'",
    "google-api-python-client>=2.150,<3.0",
    "google-cloud-bigquery[pandas]>=3.30,<4.0",
    "google-cloud-storage>=3.0,<4.0",
    "googleads>=47.0,<51.0",
    "db-dtypes>=1.5.1,<2.0",
    "python-dotenv>=1.0.1,<2.0",
]

[project.scripts]
gcp-api-mcp = "GoogleCloudPlatformAPI.codex.server:main"
gcp-api-agent = "GoogleCloudPlatformAPI.agents.cli:main"

[project.optional-dependencies]
dev = [
    "black==24.8.0",
    "build>=1.2,<2",
    "pydocstyle>=6.3,<7",
    "pyright>=1.1,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "twine>=6,<7",
]
codex = []
telemetry = ["opentelemetry-api>=1.25,<2"]

[tool.black]
target-version = ["py38"]

[tool.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["GoogleCloudPlatformAPI"]
pythonVersion = "3.10"

[tool.hatch.build.targets.wheel]
packages = ["GoogleCloudPlatformAPI"]

[tool.hatch.build.targets.sdist]
include = [
    "/.codex",
    "/GoogleCloudPlatformAPI",
    "/docs",
    "/tests",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/RELEASE.md",
    "/ROADMAP.md",
    "/llms.txt",
    "/pyproject.toml",
]
