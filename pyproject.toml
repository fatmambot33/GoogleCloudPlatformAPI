[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "GoogleCloudPlatformAPI"
version = "2.4.0"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "pandas",
    "google-api-python-client",
    "google-cloud-bigquery",
    "google-cloud-bigquery[pandas]",
    "google-cloud-storage",
    "googleads",
    "db-dtypes",
    "python-dotenv",
]

[project.scripts]
gcp-api-mcp = "GoogleCloudPlatformAPI.codex.server:main"

[project.optional-dependencies]
dev = [
    "black==26.3.1",
    "build",
    "pydocstyle",
    "pyright",
    "pytest",
    "pytest-cov",
    "twine",
]
codex = []

[tool.black]
target-version = ["py37"]

[tool.pydocstyle]
convention = "numpy"

[tool.pyright]
include = ["GoogleCloudPlatformAPI"]

[tool.hatch.build.targets.wheel]
packages = ["GoogleCloudPlatformAPI"]

[tool.hatch.build.targets.sdist]
include = [
    "/GoogleCloudPlatformAPI",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/tests",
]
